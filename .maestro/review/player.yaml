# One puzzle from Today: its start card, then (if there is one) its board after Play.
appId: ${APP_ID}
---
- tapOn: Today
- extendedWaitUntil:
    visible:
      id: today-screen
    timeout: 20000
# Rows below the fold need a scroll before they can be tapped (iPhone lists them all).
- scrollUntilVisible:
    element:
      id: today-${TYPE}
    direction: DOWN
    centerElement: true
    timeout: 20000
# Let the scroll's momentum stop before tapping, so the row is where the tap thinks it is.
- waitForAnimationToEnd
- tapOn:
    id: today-${TYPE}
- waitForAnimationToEnd
# Still on Today: the scroll overshot and the row slid up under the masthead. Bring it back
# down to the middle and tap again, once.
- runFlow:
    when:
      notVisible:
        id: 'start-card|finish-sheet|lab-finish|play-screen|[a-z]+-home'
    commands:
      - scrollUntilVisible:
          element:
            id: today-${TYPE}
          direction: UP
          centerElement: true
          timeout: 10000
      - waitForAnimationToEnd
      - tapOn:
          id: today-${TYPE}
- extendedWaitUntil:
    visible:
      id: 'start-card|finish-sheet|lab-finish|play-screen|[a-z]+-home'
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: ${SET}-${TYPE}-start
- tapOn:
    text: 'Play|Start|Continue|Resume'
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${SET}-${TYPE}-play
# Android has a Back key; on iPhone, the header's own button.
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: 'Back to Puzzles'
- extendedWaitUntil:
    visible:
      id: today-screen
    timeout: 10000
