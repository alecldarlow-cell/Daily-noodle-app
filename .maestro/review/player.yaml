# One puzzle from Today: its start card, then (if there is one) its board after Play.
appId: ${APP_ID}
---
- tapOn: Today
- extendedWaitUntil:
    visible:
      id: today-${TYPE}
    timeout: 20000
- tapOn:
    id: today-${TYPE}
- extendedWaitUntil:
    visible:
      id: play-screen
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: ${SET}-${TYPE}-start
- tapOn:
    text: 'Play|Start|Continue|Resume'
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${SET}-${TYPE}-play
# Android's Back key; iPhones have none, so the puzzle's own Back to Puzzles (#217).
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: 'Back to Puzzles'
- extendedWaitUntil:
    visible:
      id: today-screen
    timeout: 10000
