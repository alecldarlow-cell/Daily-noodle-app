# One puzzle from Today: its start card, then (if there is one) its board after Play.
appId: ${APP_ID}
---
- tapOn: Today
- extendedWaitUntil:
    visible:
      id: today-screen
    timeout: 20000
# Rows below the fold need a scroll before they can be tapped (iPhone lists them all).
- scrollUntilVisible:
    element:
      id: today-${TYPE}
    direction: DOWN
    timeout: 20000
- tapOn:
    id: today-${TYPE}
- extendedWaitUntil:
    visible:
      id: play-screen
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: ${SET}-${TYPE}-start
- tapOn:
    text: 'Play|Start|Continue|Resume'
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${SET}-${TYPE}-play
# Android has a Back key; on iPhone, the header's own button.
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: 'Back to Puzzles'
- extendedWaitUntil:
    visible:
      id: today-screen
    timeout: 10000
