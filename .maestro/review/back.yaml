# Android Back (#189): each tab goes back to Today, a puzzle goes back to where it was
# opened, and Back on Today leaves the app.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: today-screen
    timeout: 40000
- tapOn: Leagues
- waitForAnimationToEnd
- back
- assertVisible:
    id: today-screen
- tapOn: Archive
- extendedWaitUntil:
    visible:
      id: archive-screen
    timeout: 20000
- back
- assertVisible:
    id: today-screen
- tapOn: Account
- extendedWaitUntil:
    visible:
      id: account-screen
    timeout: 10000
- back
- assertVisible:
    id: today-screen
# A puzzle opened from Today comes back to Today.
- tapOn:
    id: today-path
- extendedWaitUntil:
    visible:
      id: 'start-card|finish-sheet|play-screen'
    timeout: 15000
- back
- extendedWaitUntil:
    visible:
      id: today-screen
    timeout: 5000
# One opened from the Archive comes back to the Archive.
- tapOn: Archive
- extendedWaitUntil:
    visible:
      id: archive-screen
    timeout: 20000
- tapOn: Mini
- tapOn: Mini 100
- extendedWaitUntil:
    visible:
      id: 'start-card|finish-sheet|play-screen'
    timeout: 15000
- back
- extendedWaitUntil:
    visible:
      id: archive-screen
    timeout: 5000
- takeScreenshot: back-archive
# Archive's Back goes to Today; Today's Back leaves the app.
- back
- assertVisible:
    id: today-screen
- back
- waitForAnimationToEnd
- assertNotVisible:
    id: today-screen
