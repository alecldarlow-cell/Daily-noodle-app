# App Store screenshots (#217), on a 6.9-inch iPhone simulator with a 9:41 status bar: Today,
# a Mini board, Leagues and the Archive, matching the Play set's captions where the scene
# is the same. SET names the run (light, dark).
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: today-screen
    timeout: 40000
- waitForAnimationToEnd
- takeScreenshot: store-${SET}-today
- scrollUntilVisible:
    element:
      id: today-mini
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: today-mini
- extendedWaitUntil:
    visible:
      id: 'start-card|finish-sheet|lab-finish|play-screen|[a-z]+-home'
    timeout: 15000
- tapOn:
    text: 'Play|Start'
    optional: true
- waitForAnimationToEnd
- takeScreenshot: store-${SET}-mini
- tapOn: 'Back to Puzzles'
- extendedWaitUntil:
    visible:
      id: today-screen
    timeout: 10000
- tapOn: Leagues
- waitForAnimationToEnd
- takeScreenshot: store-${SET}-leagues
- tapOn: Archive
- extendedWaitUntil:
    visible:
      id: archive-screen
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: store-${SET}-archive
