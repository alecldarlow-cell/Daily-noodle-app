# Leave a puzzle part-played, close the app, come back: it should open where it was (#202).
# Screenshots before and after, to compare by eye.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: today-screen
    timeout: 40000
- scrollUntilVisible:
    element:
      id: today-borders
    direction: DOWN
    timeout: 20000
- tapOn:
    id: today-borders
- tapOn:
    id: borders-play-button
- tapOn:
    id: borders-opt-0
- tapOn: 'Next'
- takeScreenshot: resume-before
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: today-screen
    timeout: 40000
- scrollUntilVisible:
    element:
      id: today-borders
    direction: DOWN
    timeout: 20000
- tapOn:
    id: today-borders
- waitForAnimationToEnd
- takeScreenshot: resume-after
