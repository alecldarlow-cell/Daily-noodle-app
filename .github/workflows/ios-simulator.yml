name: iOS simulator checks

# The iOS pass (#217): builds this commit for the iPhone simulator (no signing, no Apple
# account), then runs .maestro/review/ on iPhone simulators under normal, dark, the largest
# text, a small screen and reduce motion, checks the app's own links, and takes App Store
# screenshots at the 6.9-inch size. Screenshots and a summary upload as an artifact; a
# failing check's last lines are printed in the log as well.
# Run by hand only (Actions → iOS simulator checks → Run workflow). macOS runners are free
# on this public repo. Nothing is published or signed for the store.
on:
  workflow_dispatch:
    inputs:
      app_run:
        description: >-
          Reuse the app built by an earlier run of this workflow (its run id), to test
          changed flows without a 25-minute build. Blank builds this commit.
        required: false
        default: ''
      only:
        description: Run only these checks (comma-separated names, e.g. screens-normal,links). Blank runs all.
        required: false
        default: ''
  push: # TEMPORARY while #217 is built; removed before merge
    branches: [ios/simulator-checks]

permissions:
  contents: write # TEMPORARY while #217 is built (the scratch branch below); read before merge
  actions: read

concurrency:
  group: ios-simulator-${{ github.ref }}
  cancel-in-progress: true

env:
  # TEMPORARY while #217 is built: what a push to the branch runs.
  PUSH_APP_RUN: '46155343502'
  PUSH_ONLY: 'screens-dark,borders-round-dark,screens-text-largest,screens-reduced-motion'

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 150
    env:
      APP_ID: uk.co.dailynoodle.app
      # The public values every build carries (eas.json › base.env).
      EXPO_PUBLIC_SUPABASE_URL: https://gnehttjheoyutrfsvslq.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_dEMntRNiElpGHn3Hd5Ef1Q_HvLa2wTB
      EXPO_PUBLIC_SYNC: '1'
    steps:
      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          IN_APP_RUN: ${{ inputs.app_run }}
          IN_ONLY: ${{ inputs.only }}
        run: |
          if [ "$EVENT" = push ]; then APP_RUN=$PUSH_APP_RUN; ONLY=$PUSH_ONLY
          else APP_RUN=$IN_APP_RUN; ONLY=$IN_ONLY; fi
          case "$APP_RUN" in ''|*[!0-9]*) [ -n "$APP_RUN" ] && { echo "app_run must be a run id"; exit 1; } ;; esac
          echo "app_run=$APP_RUN" >> "$GITHUB_OUTPUT"
          echo "only=$ONLY" >> "$GITHUB_OUTPUT"
          echo "Reusing the app from run: ${APP_RUN:-no, building this commit}; checks: ${ONLY:-all}"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use the newest Xcode on the runner
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version
          xcrun simctl list runtimes
      - if: steps.plan.outputs.app_run == ''
        run: npm ci
      - name: Prebuild iOS
        if: steps.plan.outputs.app_run == ''
        run: |
          npx expo prebuild --platform ios --clean
          # Run this commit's bundle, never an over-the-air update from a channel.
          P=$(ls ios/*/Supporting/Expo.plist | head -1)
          /usr/libexec/PlistBuddy -c "Delete :EXUpdatesEnabled" "$P" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :EXUpdatesEnabled bool false" "$P"
      - name: Build for the simulator (unsigned)
        if: steps.plan.outputs.app_run == ''
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          if ! xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
              -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath build CODE_SIGNING_ALLOWED=NO > xcodebuild.log 2>&1; then
            grep -E "error:|BUILD FAILED" xcodebuild.log | head -40
            tail -80 xcodebuild.log
            exit 1
          fi
          APP=$(ls -d "$PWD"/build/Build/Products/Release-iphonesimulator/*.app | head -1)
          echo "APP=$APP" >> "$GITHUB_ENV"
          ditto -c -k --keepParent "$APP" ios-app.zip
      - name: Keep the app for later runs
        if: steps.plan.outputs.app_run == ''
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: ios-app.zip
          retention-days: 7
      - name: Fetch the app from the earlier run
        if: steps.plan.outputs.app_run != ''
        uses: actions/download-artifact@v4
        with:
          name: ios-app
          run-id: ${{ steps.plan.outputs.app_run }}
          github-token: ${{ github.token }}
          path: reuse
      - name: Unpack the earlier app
        if: steps.plan.outputs.app_run != ''
        run: |
          ditto -x -k reuse/ios-app.zip reuse/app
          echo "APP=$(ls -d "$PWD"/reuse/app/*.app | head -1)" >> "$GITHUB_ENV"
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run the checks
        env:
          ONLY: ${{ steps.plan.outputs.only }}
        run: OUT=ios-results scripts/ios-simulator-checks.sh
      - name: Summary
        if: always()
        run: cat ios-results/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      # TEMPORARY while #217 is built: the screenshots and logs on a scratch branch, so they
      # can be read where the artifact store can't be reached. Removed before merge.
      - name: Screenshots to the ios-sim-shots branch
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir shots && cd shots && git init -q && git checkout -q -b ios-sim-shots
          rsync -a --exclude='logs/' --include='*/' --include='*.png' --include='*.log' --include='*.md' \
            --include='*.txt' --exclude='*' --prune-empty-dirs ../ios-results/ ./
          git add -A
          git -c user.name=github-actions -c user.email=actions@users.noreply.github.com \
            commit -qm "iOS simulator run $GITHUB_RUN_ID"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:ios-sim-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-results
          path: |
            ios-results
            xcodebuild.log
          retention-days: 14
