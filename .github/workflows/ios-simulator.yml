name: iPhone simulator checks

# The iPhone pass from #217 (iOS prep, 28 Nov 2026): builds this commit for the iPhone
# simulator and runs .maestro/review/ on it, under normal, dark, large text, an iPhone SE
# and Reduce Motion, plus the app's own links. Also captures 6.9-inch App Store
# screenshots (.maestro/store/app-store.yaml), light and dark.
#
# No Apple account, signing or money: a simulator build needs none, and macOS runners are
# free on this public repo. Nothing is published.
#
# The build carries no Supabase settings, so nothing it does reaches the live database
# (no plays, events, error reports or league calls): leagues show their signed-out,
# offline state. Puzzles still come from dailynoodle.co.uk, as for any player.
#
# Runs from "Run workflow", and on pull requests that change it or the review flows.
# "Reuse the app from run" skips the 20-minute build when only flows have changed.
on:
  workflow_dispatch:
    inputs:
      app_from_run:
        description: Reuse the app from run (a run id; blank builds it)
        type: string
        default: ''
  pull_request:
    paths:
      - .github/workflows/ios-simulator.yml
      - scripts/ios-simulator-checks.sh
      - .maestro/review/**
      - .maestro/store/**

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-simulator-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ID: uk.co.dailynoodle.app

jobs:
  build:
    name: build
    if: github.event_name != 'workflow_dispatch' || inputs.app_from_run == ''
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use the newest Xcode (SDK 58 needs 26.4 or later)
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - run: npm ci
      - name: Generate the iPhone project
        run: npx expo prebuild --platform ios --clean
      - name: Run this commit's JavaScript, never an over-the-air update
        run: /usr/libexec/PlistBuddy -c "Set :EXUpdatesEnabled false" ios/DailyNoodle/Supporting/Expo.plist
      - name: Build for the simulator (no signing)
        run: |
          set -o pipefail
          xcodebuild -workspace ios/DailyNoodle.xcworkspace -scheme DailyNoodle \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build \
            ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
            build > xcodebuild.log 2>&1 || { tail -200 xcodebuild.log; exit 1; }
          tail -5 xcodebuild.log
      - name: Keep the app and what App Review reads from it
        run: |
          mkdir -p ios-build
          APP=ios/build/Build/Products/Release-iphonesimulator/DailyNoodle.app
          ditto -c -k --keepParent "$APP" ios-build/DailyNoodle.app.zip
          plutil -convert xml1 -o ios-build/Info.plist "$APP/Info.plist"
          cp ios/DailyNoodle/PrivacyInfo.xcprivacy ios-build/ 2>/dev/null || echo "no app privacy manifest" > ios-build/PrivacyInfo.missing
          find "$APP" -name PrivacyInfo.xcprivacy | sed "s#^$APP/##" > ios-build/privacy-manifests.txt
          cp xcodebuild.log ios-build/
      - uses: actions/upload-artifact@v4
        with:
          name: ios-sim-app
          path: ios-build
          retention-days: 14

  checks:
    name: checks
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - uses: actions/download-artifact@v4
        with:
          name: ios-sim-app
          path: ios-build
          run-id: ${{ inputs.app_from_run || github.run_id }}
          github-token: ${{ github.token }}
      - run: ditto -x -k ios-build/DailyNoodle.app.zip ios-build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run the checks
        run: APP=ios-build/DailyNoodle.app OUT=ios-results scripts/ios-simulator-checks.sh
      - name: Summary
        if: always()
        run: cat ios-results/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-results
          path: ios-results
          retention-days: 14
