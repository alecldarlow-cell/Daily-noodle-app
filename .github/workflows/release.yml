name: Release

# Ships the app once Alec has added the EXPO_TOKEN repository secret (docs/install.md).
# Without it every job is skipped, so this workflow is harmless until then.
#
# - Every push to main publishes an EAS Update to the "preview" channel once that commit's
#   CI has finished green: installed preview builds pick up JavaScript changes on their
#   next launch. Runtime versions use the native fingerprint, so an update never reaches a
#   build whose native code differs.
#   Only green commits publish (hardening G1): this runs when the CI workflow completes
#   (workflow_run), only for a push to main that CI passed, and scripts/ci-gate.js checks
#   again through GitHub's API that every CI run for that exact commit is green and that it
#   is still main's tip (an older commit whose CI finishes late never overwrites a newer
#   one) before `eas update`.
# - "Run workflow" builds new binaries (needed after any native change), and can send
#   the iOS build to TestFlight.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile
        type: choice
        options: [preview, production, development]
        default: preview
      platform:
        description: Platform
        type: choice
        options: [all, ios, android]
        default: all
      submit:
        description: Send the iOS production build to TestFlight
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # ci-gate.js reads the commit's CI runs.
  actions: read

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EAS: npx --yes eas-cli@25.3.0

jobs:
  update:
    name: update
    # A push to main (not a pull request from a branch called main) whose CI passed.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Skip until EXPO_TOKEN is set
        if: env.EXPO_TOKEN == ''
        run: echo "::notice::No EXPO_TOKEN secret yet; nothing published (docs/install.md)."
      - uses: actions/checkout@v4
        if: env.EXPO_TOKEN != ''
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Only a green commit that is still main's tip publishes
        id: gate
        if: env.EXPO_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/ci-gate.js "$SHA" --tip main
      - uses: actions/setup-node@v4
        if: env.EXPO_TOKEN != '' && steps.gate.outputs.publish == 'true'
        with:
          node-version: 22
          cache: npm
      - if: env.EXPO_TOKEN != '' && steps.gate.outputs.publish == 'true'
        run: npm ci
      - name: Publish an update to preview builds
        if: env.EXPO_TOKEN != '' && steps.gate.outputs.publish == 'true'
        # eas-cli 25 refuses --non-interactive without --environment. The commit's first line
        # goes through an env var so quotes in a message can't break the command.
        # `eas update` doesn't read eas.json's build env (it reads EAS's server-side variables,
        # and preview has none), so export the preview profile's env here, or the update ships
        # without EXPO_PUBLIC_SUPABASE_* and leagues stop working (25 Oct 2026).
        env:
          MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          eval "$(node scripts/eas-profile-env.js preview)"
          $EAS update --channel preview --environment preview --message "${MESSAGE%%$'\n'*}" --non-interactive

  build:
    name: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Stop without EXPO_TOKEN
        if: env.EXPO_TOKEN == ''
        run: |
          echo "::error::Add the EXPO_TOKEN repository secret first (docs/install.md)."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build on EAS
        run: >
          $EAS build --profile ${{ inputs.profile }} --platform ${{ inputs.platform }}
          --non-interactive --no-wait
          ${{ inputs.submit && inputs.profile == 'production' && '--auto-submit' || '' }}
