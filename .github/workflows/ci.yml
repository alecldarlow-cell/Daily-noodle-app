name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Boundary rules still bite
        run: npm run lint:selftest
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests and coverage (80% lines)
        run: npm run test:coverage -- --ci

  # Differential replay (WP8, WP10): each native player against the site's own engine,
  # on puzzles spread across the archive (50 Minis, 20 Links, 20 Tangles), every oracle
  # variant each, in headless Chromium
  # from the public site repo's pinned dev dependencies. Nothing leaves the runner:
  # the site's harness answers every request and blocks Supabase.
  replay:
    name: replay
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Clone the site
        run: git clone --depth 1 https://github.com/alecldarlow-cell/dailynoodle ../dailynoodle
      - name: The site's Playwright and pinned Chromium
        working-directory: ../dailynoodle
        run: npm ci --ignore-scripts
      - name: Replay 50 Minis, web engine against the native model
        run: node scripts/replay.js --type mini --sample 50 --site ../dailynoodle --workers 4
      - name: Replay 20 Links, web engine against the native model
        run: node scripts/replay.js --type link --sample 20 --site ../dailynoodle --workers 4
      - name: Replay 20 Tangles, web engine against the native engine
        run: node scripts/replay.js --type tangle --sample 20 --site ../dailynoodle --workers 4
